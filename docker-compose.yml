services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cerdasnet-vps-control:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_ORIGIN: "${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}"
      DATA_FILE: /app/data/database.json
      FRONTEND_DIST: /app/frontend/dist
      TOKEN_ENCRYPTION_KEY: "${TOKEN_ENCRYPTION_KEY:?Set a random 32-byte TOKEN_ENCRYPTION_KEY}"
      COOKIE_SECURE: "true"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-300}"
      SERVER_POLL_SECONDS: "${SERVER_POLL_SECONDS:-30}"
      METRICS_REFRESH_SECONDS: "${METRICS_REFRESH_SECONDS:-300}"
      METRICS_RETENTION_DAYS: "${METRICS_RETENTION_DAYS:-30}"
      AUTO_SYNC_ON_BOOT: "${AUTO_SYNC_ON_BOOT:-true}"
    volumes:
      - panel-data:/app/data
      - panel-backups:/app/backups
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [panel]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  panel-data:
  panel-backups:

networks:
  panel:
    driver: bridge
